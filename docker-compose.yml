version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: zorar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # خادم محلي اختياري لـ PostgreSQL للتطوير السريع في حالة عدم الاتصال بـ Supabase
  local_postgres:
    image: postgres:16-alpine
    container_name: zorar-local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zorar
      POSTGRES_PASSWORD: zorar_secret_password
      POSTGRES_DB: zorar_edu
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
